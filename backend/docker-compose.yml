services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: docuciv
      POSTGRES_PASSWORD: docuciv
      POSTGRES_DB: docuciv
    ports:
      - "5432:5432"
    volumes:
      - docuciv_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

volumes:
  docuciv_postgres_data:
