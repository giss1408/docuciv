services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: docuciv_owner
      POSTGRES_PASSWORD: docuciv_owner
      POSTGRES_DB: docuciv
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: quay.io/minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000"]
